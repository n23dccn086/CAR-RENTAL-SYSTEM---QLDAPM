version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: car-rental-db
    environment:
      POSTGRES_DB: car_rental
      POSTGRES_USER: postgres
      # Khớp PASSWORD_POSTGRES trong backend/.env.example và default của application.yml
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: car-rental-redis
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
