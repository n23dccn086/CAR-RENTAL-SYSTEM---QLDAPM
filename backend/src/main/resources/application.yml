spring:
  application:
    name: car-rental-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/car_rental
    username: postgres
    password: yourpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080
  servlet:
    context-path: /api/v1

jwt:
  secret: Y2FyLXJlbnRhbC1zeXN0ZW0tc3VwZXItc2VjcmV0LWtleS0yMDI2LTI1Ni1iaXRz
  expiration: 3600000
  refresh-expiration: 604800000

logging:
  level:
    com.carrental: DEBUG