spring:
  application:
    name: car-rental-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${HOST_POSTGRES:localhost}:${PORT_POSTGRES:5432}/${DB_POSTGRES:car_rental}?sslmode=${SSLMODE_POSTGRES:disable}}
    username: ${USER_POSTGRES:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${PASSWORD_POSTGRES:${SPRING_DATASOURCE_PASSWORD:123456}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${HOST_REDIS:${SPRING_DATA_REDIS_HOST:localhost}}
      port: ${PORT_REDIS:${SPRING_DATA_REDIS_PORT:6379}}
      password: ${PASSWORD_REDIS:}
      database: ${DB_REDIS:0}
      repositories:
        enabled: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 100MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/api/v1}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha

jwt:
  secret: ${JWT_SECRET:Y2FyLXJlbnRhbC1zeXN0ZW0tc3VwZXItc2VjcmV0LWtleS0yMDI2LTI1Ni1iaXRz}
  expiration: ${JWT_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

payment:
  momo:
    partner-code: ${PAYMENT_MOMO_PARTNER_CODE:DEMO}
    access-key: ${PAYMENT_MOMO_ACCESS_KEY:DEMO_ACCESS}
    secret-key: ${PAYMENT_MOMO_SECRET_KEY:DEMO_SECRET}
    endpoint: ${PAYMENT_MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
    return-url: ${PAYMENT_MOMO_RETURN_URL:http://localhost:8080/api/v1/payments/callback/momo}
    notify-url: ${PAYMENT_MOMO_NOTIFY_URL:http://localhost:8080/api/v1/payments/callback/momo}

app:
  upload-dir: ${APP_UPLOAD_DIR:uploads}

logging:
  level:
    root: WARN
    com.carrental: INFO
    org.hibernate: WARN
    org.springframework: WARN
    com.zaxxer.hikari: WARN
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{0} - %msg%n"