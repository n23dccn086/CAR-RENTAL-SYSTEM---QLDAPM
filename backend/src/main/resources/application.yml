spring:
  application:
    name: car-rental-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/car_rental
    username: postgres
    password: yourpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 100MB

server:
  port: 8080
  servlet:
    context-path: /api/v1

jwt:
  secret: Y2FyLXJlbnRhbC1zeXN0ZW0tc3VwZXItc2VjcmV0LWtleS0yMDI2LTI1Ni1iaXRz
  expiration: 3600000
  refresh-expiration: 604800000

logging:
  level:
    root: WARN
    com.carrental: INFO
    org.hibernate: WARN
    org.springframework: WARN
    com.zaxxer.hikari: WARN
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{0} - %msg%n"