          description: Lệnh rút tiền đã hoàn thành
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  # ==========================================================
  # MODULE 12: AI CHATBOT (3 endpoints)
  # ==========================================================
  /ai/chat:
    post:
      tags: [12. AI Chatbot]
      summary: Hỏi đáp trợ lý AI theo ngữ cảnh vai trò (Guest, Customer, Owner, Admin) (12.1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIChatRequest'
      responses:
        '200':
          description: Phản hồi thông minh kèm gợi ý hành động tiếp theo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIChatApiResponse'

  /ai/suggestions:
    get:
      tags: [12. AI Chatbot]
      summary: Lấy danh sách câu hỏi gợi ý nhanh theo vai trò của người dùng (12.2)
      responses:
        '200':
          description: Danh sách gợi ý câu hỏi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AISuggestionsApiResponse'

  /ai/history:
    get:
      tags: [12. AI Chatbot]
      summary: Xem lịch sử hội thoại gần nhất với trợ lý ảo (12.3)
      responses:
        '200':
          description: Lịch sử tin nhắn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIChatHistoryApiResponse'

  # ==========================================================
  # MODULE 13: NOTIFICATIONS (2 endpoints)
  # ==========================================================
  /notifications:
    get:
      tags: [13. Notifications]
      summary: Lấy danh sách thông báo của người dùng (13.1)
      responses:
        '200':
          description: Danh sách thông báo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListApiResponse'

  /notifications/{id}/read:
    put:
      tags: [13. Notifications]
      summary: Đánh dấu thông báo đã đọc (13.2)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Đã đánh dấu thông báo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  # ==========================================================
  # MODULE 14: UPLOAD & EXCEL (2 endpoints)
  # ==========================================================
  /files/upload:
    post:
      tags: [14. Upload & Excel]
      summary: Tải lên hình ảnh xe, tài liệu và chữ ký điện tử (14.1)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: File đã tải lên thành công, trả về URL truy cập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadApiResponse'

  /owner/cars/import:
    post:
      tags: [14. Upload & Excel]
      summary: Nhập hàng loạt danh sách xe qua file Excel chuẩn 11 cột (14.2)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Kết quả import xe, số dòng hợp lệ và chi tiết lỗi nếu có
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExcelImportApiResponse'

# ==========================================================
# SCHEMAS & REUSABLE DTOs
# ==========================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Nhập Access Token JWT (không cần gõ tiền tố Bearer)

  responses:
    BadRequest:
      description: Dữ liệu gửi lên không hợp lệ (Validation Error)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Unauthorized:
      description: Chưa đăng nhập hoặc Token JWT không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Conflict:
      description: Dữ liệu đã tồn tại (SĐT hoặc Email đã đăng ký)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

  schemas:
    # Basic Envelopes
    ApiResponseVoid:
      type: object
      properties:
        success: { type: boolean, example: true }
        code: { type: integer, example: 0 }
        message: { type: string, example: Thao tác thành công }

    ApiErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        code: { type: integer, example: 400 }
        message: { type: string, example: Dữ liệu không hợp lệ }
        timestamp: { type: string, example: '2026-10-10T14:30:00' }

    # Auth Schemas
    RegisterRequest:
      type: object
      required: [name, phone, password]
      properties:
        name: { type: string, example: Nguyễn Văn A }
        phone: { type: string, example: '0901234567' }
        password: { type: string, example: Pass123@ }
        email: { type: string, example: a@test.com }
        role: { type: string, enum: [customer, owner], default: customer }

    LoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone: { type: string, example: '0901234567' }
        password: { type: string, example: Pass123@ }

    RefreshTokenRequest:
      type: object
      properties:
        refresh_token: { type: string, example: eyJhbGciOiJIUzI1NiIs... }
        refreshToken: { type: string, example: eyJhbGciOiJIUzI1NiIs... }

    ForgotPasswordRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, example: '0901234567' }

    ResetPasswordRequest:
      type: object
      required: [phone, otp, newPassword]
      properties:
        phone: { type: string, example: '0901234567' }
        otp: { type: string, example: '123456' }
        new_password: { type: string, example: NewPass123@ }
        newPassword: { type: string, example: NewPass123@ }

    UpdateProfileRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Nguyễn Văn B }
        email: { type: string, example: b@test.com }
        address: { type: string, example: 123 Nguyễn Huệ, Q1, TP.HCM }
        date_of_birth: { type: string, format: date, example: '1995-01-15' }
        dateOfBirth: { type: string, format: date, example: '1995-01-15' }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        current_password: { type: string, example: OldPass123@ }
        currentPassword: { type: string, example: OldPass123@ }
        new_password: { type: string, example: NewPass123@ }
        newPassword: { type: string, example: NewPass123@ }

    AuthResponseData:
      type: object
      properties:
        user_id: { type: integer, example: 123 }
        name: { type: string, example: Nguyễn Văn A }
        phone: { type: string, example: '0901234567' }
        role: { type: string, example: customer }
        token: { type: string, example: eyJhbGciOiJIUzI1NiIs... }
        accessToken: { type: string, example: eyJhbGciOiJIUzI1NiIs... }
        refresh_token: { type: string, example: eyJhbGciOiJIUzI1NiIs... }
        user: { $ref: '#/components/schemas/UserDto' }

    AuthApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        code: { type: integer, example: 0 }
        message: { type: string, example: Đăng nhập thành công }
        data: { $ref: '#/components/schemas/AuthResponseData' }

    UserDto:
      type: object
      properties:
        id: { type: integer, example: 123 }
        name: { type: string, example: Nguyễn Văn A }
        phone: { type: string, example: '0901234567' }
        email: { type: string, example: a@test.com }
        role: { type: string, example: CUSTOMER }
        verificationStatus: { type: string, example: VERIFIED }
        verification_status: { type: string, example: verified }
        avatar_url: { type: string, example: https://uploads.vn/avatars/u123.jpg }
        address: { type: string, example: 123 Nguyễn Huệ, TP.HCM }
        date_of_birth: { type: string, example: '1995-01-15' }
        created_at: { type: string, example: '2026-09-01T10:00:00' }

    UserApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/UserDto' }

    VerificationApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Upload thành công }
        data:
          type: object
          properties:
            verification_status: { type: string, example: PENDING_VERIFICATION }

    # Car Schemas
    CarDto:
      type: object
      properties:
        id: { type: integer, example: 1 }
        plateNumber: { type: string, example: 51A-12345 }
        brand: { type: string, example: Toyota }
        model: { type: string, example: Camry }
        year: { type: integer, example: 2023 }
        color: { type: string, example: Trắng }
        seats: { type: integer, example: 5 }
        transmission: { type: string, example: AUTOMATIC }
        fuelType: { type: string, example: GASOLINE }
        pricePerDay: { type: number, example: 1200000 }
        status: { type: string, example: AVAILABLE }
        location: { type: string, example: TP.HCM }
        thumbnailUrl: { type: string, example: https://uploads.vn/cars/camry.jpg }

    CarPageApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/CarDto' }
            totalPages: { type: integer, example: 8 }
            totalElements: { type: integer, example: 150 }

    CarDetailApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/CarDto' }

    CarListApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/CarDto' }

    CarCreateRequest:
      type: object
      required: [plateNumber, brand, model, seats, pricePerDay]
      properties:
        plateNumber: { type: string, example: 51A-12345 }
        brand: { type: string, example: Toyota }
        model: { type: string, example: Camry }
        year: { type: integer, example: 2023 }
        seats: { type: integer, example: 5 }
        pricePerDay: { type: number, example: 1200000 }

    CarUpdateRequest:
      type: object
      properties:
        pricePerDay: { type: number, example: 1300000 }
        description: { type: string, example: Xe mới bảo dưỡng định kỳ }

    CarPricingRequest:
      type: object
      properties:
        pricePerDay: { type: number, example: 1200000 }
        priceWeekend: { type: number, example: 1400000 }
        overtimeFeePerHour: { type: number, example: 100000 }
        overKmFee: { type: number, example: 5000 }

    AvailabilityApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            isAvailable: { type: boolean, example: true }

    CalendarApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            type: object
            properties:
              startDate: { type: string, format: date-time }
              endDate: { type: string, format: date-time }
              status: { type: string, example: BOOKED }

    # Booking Schemas
    BookingCreateRequest:
      type: object
      required: [carId, startDate, endDate]
      properties:
        carId: { type: integer, example: 1 }
        startDate: { type: string, format: date-time, example: '2026-10-15T08:00:00' }
        endDate: { type: string, format: date-time, example: '2026-10-18T18:00:00' }
        rentalType: { type: string, example: SELF_DRIVE }
        deliveryAddress: { type: string, example: Sân bay Tân Sơn Nhất }

    BookingDto:
      type: object
      properties:
        id: { type: integer, example: 101 }
        bookingCode: { type: string, example: BK-20261015-001 }
        carId: { type: integer, example: 1 }
        customerId: { type: integer, example: 123 }
        status: { type: string, example: CONFIRMED }
        totalAmount: { type: number, example: 3600000 }
        depositAmount: { type: number, example: 1080000 }
        startDate: { type: string, example: '2026-10-15T08:00:00' }
        endDate: { type: string, example: '2026-10-18T18:00:00' }

    BookingApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/BookingDto' }

    BookingListApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/BookingDto' }

    # Payment Schemas
    PaymentCreateRequest:
      type: object
      required: [bookingId, amount, paymentType]
      properties:
        bookingId: { type: integer, example: 101 }
        amount: { type: number, example: 1080000 }
        paymentType: { type: string, example: DEPOSIT }
        paymentMethod: { type: string, example: MOMO }

    PaymentDto:
      type: object
      properties:
        id: { type: integer, example: 501 }
        bookingId: { type: integer, example: 101 }
        amount: { type: number, example: 1080000 }
        status: { type: string, example: SUCCESS }
        paymentUrl: { type: string, example: https://momo.vn/pay/order-123 }

    PaymentApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/PaymentDto' }

    PaymentListApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/PaymentDto' }

    # Handover Schemas
    HandoverPickupRequest:
      type: object
      required: [bookingId, startKm, startFuelPercent]
      properties:
        bookingId: { type: integer, example: 101 }
        startKm: { type: number, example: 25000 }
        startFuelPercent: { type: integer, example: 100 }
        notes: { type: string, example: Xe sạch sẽ, không trầy xước }
        images: { type: array, items: { type: string } }

    HandoverReturnRequest:
      type: object
      required: [bookingId, endKm, endFuelPercent]
      properties:
        bookingId: { type: integer, example: 101 }
        endKm: { type: number, example: 25400 }
        endFuelPercent: { type: integer, example: 90 }
        notes: { type: string, example: Trả đúng hạn, trầy nhẹ cản sau }

    HandoverApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            id: { type: integer, example: 77 }
            bookingId: { type: integer, example: 101 }
            lateHours: { type: number, example: 0 }
            overKm: { type: number, example: 0 }
            penaltyFee: { type: number, example: 0 }

    # Driver Schemas
    DriverCreateRequest:
      type: object
      required: [name, phone, licenseNumber]
      properties:
        name: { type: string, example: Trần Văn Tài }
        phone: { type: string, example: '0912345678' }
        licenseNumber: { type: string, example: B2-998877 }
        experienceYears: { type: integer, example: 5 }

    DriverUpdateRequest:
      type: object
      properties:
        experienceYears: { type: integer, example: 6 }
        status: { type: string, example: ACTIVE }

    DriverDto:
      type: object
      properties:
        id: { type: integer, example: 15 }
        name: { type: string, example: Trần Văn Tài }
        phone: { type: string, example: '0912345678' }
        status: { type: string, example: ACTIVE }

    DriverApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/DriverDto' }

    DriverListApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/DriverDto' }

    # Review Schemas
    ReviewCreateRequest:
      type: object
      required: [bookingId, carRating, ownerRating]
      properties:
        bookingId: { type: integer, example: 101 }
        carRating: { type: integer, example: 5 }
        ownerRating: { type: integer, example: 5 }
        comment: { type: string, example: Xe chạy rất êm, chủ xe nhiệt tình! }

    ReviewDto:
      type: object
      properties:
        id: { type: integer, example: 88 }
        carRating: { type: integer, example: 5 }
        ownerRating: { type: integer, example: 5 }
        comment: { type: string, example: Rất hài lòng! }
        customerName: { type: string, example: Nguyễn Văn A }

    ReviewApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/ReviewDto' }

    ReviewListApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/ReviewDto' }

    # Dispute Schemas
    DisputeCreateRequest:
      type: object
      required: [bookingId, reason, claimAmount]
      properties:
        bookingId: { type: integer, example: 101 }
        reason: { type: string, example: Xe bị hỏng điều hòa giữa đường }
        claimAmount: { type: number, example: 500000 }
        evidenceImages: { type: array, items: { type: string } }

    DisputeResolveRequest:
      type: object
      required: [resolution, refundAmount]
      properties:
        resolution: { type: string, example: Đồng ý hoàn lại 50% tiền cọc cho khách }
        refundAmount: { type: number, example: 500000 }

    DisputeDto:
      type: object
      properties:
        id: { type: integer, example: 33 }
        bookingId: { type: integer, example: 101 }
        status: { type: string, example: PENDING }
        claimAmount: { type: number, example: 500000 }

    DisputeApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/DisputeDto' }

    DisputeListApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            disputes:
              type: array
              items: { $ref: '#/components/schemas/DisputeDto' }
            pagination:
              type: object
              properties:
                page: { type: integer, example: 1 }
                limit: { type: integer, example: 10 }
                total: { type: integer, example: 15 }
                total_pages: { type: integer, example: 2 }

    # Withdrawal Schemas
    WithdrawalCreateRequest:
      type: object
      required: [amount, bankName, accountNumber, accountName]
      properties:
        amount: { type: number, example: 5000000 }
        bankName: { type: string, example: Vietcombank }
        accountNumber: { type: string, example: '0071001234567' }
        accountName: { type: string, example: NGUYEN VAN A }

    WithdrawalDto:
      type: object
      properties:
        id: { type: integer, example: 91 }
        amount: { type: number, example: 5000000 }
        status: { type: string, example: PENDING }
        bankName: { type: string, example: Vietcombank }

    WithdrawalApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/WithdrawalDto' }

    WithdrawalListApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/WithdrawalDto' }

    WalletApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            balance: { type: number, example: 12500000 }
            lockedAmount: { type: number, example: 5000000 }

    # Admin Schemas
    AdminDashboardApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            totalRevenue: { type: number, example: 150000000 }
            platformRevenue: { type: number, example: 15000000 }
            cancelRate: { type: number, example: 0.04 }
            csat: { type: number, example: 4.85 }

    AdminUserListApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/UserDto' }

    # AI Chatbot Schemas
    AIChatRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, example: 'Tôi muốn tìm xe 7 chỗ đi Vũng Tàu' }
        role: { type: string, example: CUSTOMER }

    AIChatApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            reply: { type: string, example: 'Dưới đây là một số dòng xe 7 chỗ phù hợp...' }
            suggestions: { type: array, items: { type: string } }

    AISuggestionsApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { type: string }

    AIChatHistoryApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            type: object
            properties:
              role: { type: string, example: user }
              content: { type: string, example: Xin chào }

    # Notification Schemas
    NotificationListApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, example: 1 }
              title: { type: string, example: Đơn đặt xe thành công }
              content: { type: string, example: Đơn BK-101 đã được xác nhận }
              isRead: { type: boolean, example: false }

    # File & Excel Schemas
    FileUploadApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            fileUrl: { type: string, example: http://localhost:8080/api/v1/uploads/cars/img1.jpg }

    ExcelImportApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            totalRows: { type: integer, example: 20 }
            validRows: { type: integer, example: 19 }
            errorRows: { type: integer, example: 1 }