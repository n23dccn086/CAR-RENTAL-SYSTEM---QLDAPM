openapi: 3.0.3
info:
  title: Car Rental System API (Maison)
  version: 1.0.0
  description: |
    Tài liệu OpenAPI 3.0 đặc tả đầy đủ 14 Modules (64 REST API endpoints) của Hệ thống Cho thuê xe ô tô tự lái & có tài xế (Car Rental System).
    Đồng bộ 100% với tài liệu SRS QLDAPM (Phần 4: API Contract, Trang 207 - 256).
  contact:
    name: Car Rental System Support
    email: support@carrental.vn
  license:
    name: Apache 2.0
    url: https://springdoc.org

servers:
  - url: http://localhost:8080/api/v1
    description: Local Spring Boot API Server (Base Context Path: /api/v1)

tags:
  - name: 1. Authentication
    description: Đăng ký, đăng nhập, refresh token, đổi mật khẩu, OTP
  - name: 2. User & Documents
    description: Hồ sơ cá nhân và xác minh 5 ảnh GPLX/CCCD/Selfie
  - name: 3. Cars
    description: Tìm kiếm, lọc danh mục xe, thông tin chi tiết và quản lý xe của chủ xe
  - name: 4. Bookings
    description: Tạo đơn thuê xe, duyệt đơn, hủy đơn và tính phí phạt/hoàn cọc
  - name: 5. Payments
    description: Thanh toán tiền cọc, tất toán, webhook tích hợp MoMo
  - name: 6. Handover
    description: Biên bản giao xe (Pickup) và nhận lại xe (Return), chốt km/xăng
  - name: 7. Drivers
    description: Quản lý tài xế, phân công chuyến đi và tài xế nhận chuyến
  - name: 8. Reviews
    description: Đánh giá xe và đánh giá đối tác chủ xe sau chuyến đi
  - name: 9. Disputes
    description: Khiếu nại chuyến đi, giải quyết tranh chấp bồi thường
  - name: 10. Withdrawals
    description: Yêu cầu rút tiền từ ví chủ xe về tài khoản ngân hàng
  - name: 11. Admin
    description: Quản trị hệ thống, phê duyệt xe, người dùng, hoàn tiền, rút tiền
  - name: 12. AI Chatbot
    description: Trợ lý ảo AI tư vấn xe, chính sách và thống kê theo Role
  - name: 13. Notifications
    description: Hệ thống thông báo đẩy cho khách hàng, chủ xe, admin
  - name: 14. Upload & Excel
    description: Upload file phương tiện và import danh sách xe hàng loạt qua Excel

security:
  - BearerAuth: []

paths:
  # ==========================================================
  # MODULE 1: AUTHENTICATION (7 endpoints)
  # ==========================================================
  /auth/register:
    post:
      tags: [1. Authentication]
      summary: Đăng ký tài khoản khách thuê hoặc chủ xe (1.1, UC-C01)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công, trả về JWT Token và User DTO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags: [1. Authentication]
      summary: Đăng nhập bằng SĐT và mật khẩu (1.2, UC-C02)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công, trả về Access Token + Refresh Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [1. Authentication]
      summary: Cấp lại Access Token mới từ Refresh Token (1.3)
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      parameters:
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: Refresh Token truyền qua query parameter (fallback)
      responses:
        '200':
          description: Token đã được làm mới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [1. Authentication]
      summary: Đăng xuất và thu hồi session/token (1.4)
      responses:
        '200':
          description: Đăng xuất thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /auth/me:
    get:
      tags: [1. Authentication]
      summary: Lấy thông tin tài khoản hiện tại (1.5)
      responses:
        '200':
          description: Thông tin người dùng hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/forgot-password:
    post:
      tags: [1. Authentication]
      summary: Quên mật khẩu - gửi mã OTP qua SĐT (1.6)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: OTP đã được gửi qua tin nhắn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /auth/reset-password:
    post:
      tags: [1. Authentication]
      summary: Đặt lại mật khẩu bằng OTP (1.7)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Đặt lại mật khẩu thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ==========================================================
  # MODULE 2: USER & DOCUMENTS (5 endpoints)
  # ==========================================================
  /users/me:
    get:
      tags: [2. User & Documents]
      summary: Lấy thông tin hồ sơ người dùng (2.1)
      responses:
        '200':
          description: Hồ sơ người dùng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserApiResponse'
    put:
      tags: [2. User & Documents]
      summary: Cập nhật thông tin cá nhân (2.1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserApiResponse'

  /users/change-password:
    post:
      tags: [2. User & Documents]
      summary: Đổi mật khẩu tài khoản (2.1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Đổi mật khẩu thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /verification/upload:
    post:
      tags: [2. User & Documents]
      summary: Upload tài liệu xác minh (GPLX, CCCD, Selfie) (2.2, 2.3, 2.4, UC-C03)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                types:
                  type: array
                  items:
                    type: string
                    example: GPLX_FRONT
      responses:
        '200':
          description: Upload thành công danh sách ảnh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationApiResponse'

  /verification/submit:
    post:
      tags: [2. User & Documents]
      summary: Gửi toàn bộ 5 ảnh để Admin phê duyệt (2.5)
      responses:
        '200':
          description: Hồ sơ đã được gửi, trạng thái chuyển sang PENDING_VERIFICATION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationApiResponse'

  /verification/me:
    get:
      tags: [2. User & Documents]
      summary: Xem trạng thái hồ sơ xác thực cá nhân (2.5)
      responses:
        '200':
          description: Trạng thái xác minh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationApiResponse'

  # ==========================================================
  # MODULE 3: CARS (10 endpoints)
  # ==========================================================
  /cars:
    get:
      tags: [3. Cars]
      summary: Tìm kiếm và lọc danh mục xe khả dụng (3.1, UC-C04)
      security: []
      parameters:
        - name: location
          in: query
          schema: { type: string }
        - name: date_start
          in: query
          schema: { type: string, format: date-time }
        - name: date_end
          in: query
          schema: { type: string, format: date-time }
        - name: rental_type
          in: query
          schema: { type: string, enum: [SELF_DRIVE, WITH_DRIVER, BOTH] }
        - name: brand
          in: query
          schema: { type: string }
        - name: seats
          in: query
          schema: { type: integer }
        - name: transmission
          in: query
          schema: { type: string, enum: [AUTOMATIC, MANUAL] }
        - name: fuel_type
          in: query
          schema: { type: string, enum: [GASOLINE, DIESEL, ELECTRIC] }
        - name: min_price
          in: query
          schema: { type: number }
        - name: max_price
          in: query
          schema: { type: number }
        - name: sort
          in: query
          schema: { type: string, default: "price_asc", enum: [price_asc, price_desc, rating_desc, newest] }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Danh sách xe tìm kiếm thành công theo Contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarPageApiResponse'

    post:
      tags: [3. Cars]
      summary: Chủ xe tạo xe mới (3.3, UC-O02)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarCreateRequest'
      responses:
        '201':
          description: Đăng tải xe thành công, trạng thái PENDING_APPROVAL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarDetailApiResponse'

  /cars/my:
    get:
      tags: [3. Cars]
      summary: Chủ xe xem danh sách toàn bộ xe của mình (3.10, UC-O02)
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Danh sách xe của chủ xe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarPageApiResponse'

  /cars/{id}:
    get:
      tags: [3. Cars]
      summary: Xem chi tiết xe, thông số kỹ thuật và hình ảnh (3.2, UC-C05)
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Chi tiết xe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarDetailApiResponse'
    put:
      tags: [3. Cars]
      summary: Chủ xe cập nhật thông tin và tiện ích xe (3.4, UC-O02)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarUpdateRequest'
      responses:
        '200':
          description: Cập nhật xe thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarDetailApiResponse'
    delete:
      tags: [3. Cars]
      summary: Chủ xe xóa hoặc gỡ xe khỏi sàn (3.5, UC-O02)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Xóa xe thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /cars/{id}/images:
    post:
      tags: [3. Cars]
      summary: Upload hình ảnh xe (3.6)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                image_types:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Upload ảnh thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarDetailApiResponse'

  /cars/{id}/documents:
    post:
      tags: [3. Cars]
      summary: Upload giấy tờ xe (Đăng ký, Đăng kiểm, Bảo hiểm) (3.7)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                registration:
                  type: string
                  format: binary
                inspection:
                  type: string
                  format: binary
                insurance:
                  type: string
                  format: binary
      responses:
        '200':
          description: Upload giấy tờ xe thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /cars/{id}/pricing:
    put:
      tags: [3. Cars]
      summary: Cấu hình bảng giá và phụ phí của xe (3.8, UC-O04)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarPricingRequest'
      responses:
        '200':
          description: Cấu hình bảng giá thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarDetailApiResponse'

  /cars/{id}/blocked-dates:
    post:
      tags: [3. Cars]
      summary: Chủ xe chặn ngày bận / bảo dưỡng của xe (3.9)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_date, end_date]
              properties:
                start_date: { type: string, format: date }
                end_date: { type: string, format: date }
                reason: { type: string, example: "Bảo dưỡng định kỳ" }
                note: { type: string, example: "Thay dầu động cơ" }
      responses:
        '200':
          description: Chặn ngày thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /cars/{id}/availability:
    get:
      tags: [3. Cars]
      summary: Kiểm tra tính khả dụng của xe theo khoảng thời gian thuê (UC-C04)
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: startDate
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: endDate
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Kết quả kiểm tra lịch xe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityApiResponse'

  /owner/cars:
    get:
      tags: [3. Cars]
      summary: Chủ xe xem danh sách toàn bộ xe của mình (Owner UI Dashboard)
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: carType
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Danh sách xe của chủ xe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarPageApiResponse'

  /owner/cars/{id}/status:
    patch:
      tags: [3. Cars]
      summary: Chủ xe cập nhật trạng thái xe (AVAILABLE, MAINTENANCE, BROKEN, INACTIVE)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [AVAILABLE, MAINTENANCE, BROKEN, INACTIVE] }
      responses:
        '200':
          description: Trạng thái xe đã được cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarDetailApiResponse'

  /owner/cars/import:
    post:
      tags: [3. Cars]
      summary: Chủ xe import danh sách xe hàng loạt bằng file Excel (.xlsx)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Import hoàn tất
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  # ==========================================================
  # MODULE 4: BOOKINGS (7 endpoints)
  # ==========================================================
  /bookings:
    post:
      tags: [4. Bookings]
      summary: Khách hàng tạo đơn đặt xe mới (4.1, UC-C06)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
      responses:
        '201':
          description: Đơn đặt xe đã được tạo, tính cọc 30%
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingApiResponse'

  /bookings/my:
    get:
      tags: [4. Bookings]
      summary: Khách hàng xem danh sách các chuyến đi của mình (4.2, UC-C08)
      parameters:
        - name: status
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Danh sách đơn đặt xe của khách hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingListApiResponse'

  /bookings/owner:
    get:
      tags: [4. Bookings]
      summary: Chủ xe xem danh sách các đơn đặt xe của đội xe mình (4.3, UC-O05)
      parameters:
        - name: status
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Danh sách đơn thuê xe chờ xử lý
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingListApiResponse'

  /bookings/{id}:
    get:
      tags: [4. Bookings]
      summary: Xem chi tiết đơn đặt xe (4.4, UC-C08)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Chi tiết hợp đồng và lộ trình đơn thuê
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingApiResponse'

  /bookings/{id}/approve:
    post:
      tags: [4. Bookings]
      summary: Chủ xe xác nhận duyệt đơn đặt xe (4.4, UC-O06)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, example: "Đã xác nhận, giao xe đúng giờ" }
      responses:
        '200':
          description: Đơn đặt xe đã được chủ xe chấp thuận
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingApiResponse'
    put:
      tags: [4. Bookings]
      summary: Chủ xe xác nhận duyệt đơn đặt xe (PUT compatibility)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: note
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Đơn đặt xe đã được chủ xe chấp thuận
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingApiResponse'

  /bookings/{id}/reject:
    post:
      tags: [4. Bookings]
      summary: Chủ xe từ chối đơn đặt xe và nêu lý do (4.5, UC-O06)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, example: "Xe đang bảo dưỡng đột xuất" }
      responses:
        '200':
          description: Đơn đặt xe đã bị từ chối, hoàn 100% cọc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingApiResponse'
    put:
      tags: [4. Bookings]
      summary: Chủ xe từ chối đơn đặt xe (PUT compatibility)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: reason
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Đơn đặt xe đã bị từ chối
